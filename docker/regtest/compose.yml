# bitcoind + one Core Lightning node with a WebSocket listener, for regtest.
# See README.md in this directory - this has not been run end to end yet.
services:
  bitcoind:
    image: polarlightning/bitcoind:27.0
    command:
      - bitcoind
      - -regtest
      - -server
      - -txindex
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=regtest
      - -rpcpassword=regtest
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
    ports:
      - "18443:18443"
    volumes:
      - bitcoind:/home/bitcoin/.bitcoin

  cln:
    image: polarlightning/clightning:24.05
    depends_on:
      - bitcoind
    command:
      - lightningd
      - --network=regtest
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --bitcoin-rpcuser=regtest
      - --bitcoin-rpcpassword=regtest
      - --bind-addr=0.0.0.0:9735
      # The peer protocol over WebSocket, which is why the browser needs no proxy here.
      - --bind-addr=ws:0.0.0.0:9736
      - --announce-addr=127.0.0.1:9735
      - --log-level=debug
    ports:
      - "9735:9735"
      - "9736:9736"
    volumes:
      - cln:/home/clightning/.lightning

volumes:
  bitcoind:
  cln:
